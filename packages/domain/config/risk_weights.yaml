# Stubble fire risk model (spec 5.1). The functional form is a weighted sum of normalised
# inputs and is to be refitted on pilot data (open question 2). Weights must sum to 1.
version: 1
weights:
  ndvi_decay_slope: 0.20
  sowing_window_days_remaining: 0.30
  soil_moisture_index: 0.10
  historical_fire_density: 0.25
  local_machinery_shortfall: 0.15
normalisation:
  ndvi_slope_full_scale: 0.03       # NDVI units/day of decline that counts as 1.0
  sowing_window_max_days: 21        # window at/above this scores 0
  fire_density_full_scale: 0.5      # fires per km2 per season that counts as 1.0
tiers:            # lower bounds on the 0-100 score
  medium: 40
  high: 70      # matches the FPO screen's filter bands (40 / 70 / 85)
  critical: 85
activation:
  days_before_harvest_min: 7
  days_before_harvest_max: 10
