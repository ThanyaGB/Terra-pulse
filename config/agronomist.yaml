# Keypad 9 routing (ADR-22, gate G4). The queue is staffed by FPO coordinators in pilot hours; outside them (or with nobody
# on the roster) the farmer is offered a callback slot. With no roster and no slots the request is recorded and NO time is promised.
version: 1
pilot_hours:
  start: "08:00"
  end: "18:00"
  tz: Asia/Kolkata
roster: []                       # FPO coordinator ids staffing the queue in pilot hours, e.g. [fpo-coordinator-1]
callback_slots: []               # daily slot start times, e.g. ["19:30", "20:00"]; each slot takes `slot_capacity` callbacks
slot_capacity: 3
