server {
  listen 8080;
  root /usr/share/nginx/html;
  location /v1/ { proxy_pass http://vayu-api:8010; proxy_set_header Host $host; }
  location /ws/ { proxy_pass http://vayu-api:8010; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
